<!DOCTYPE html>
<html>
<head>
<title>MUTHYALA RAKESH 👑</title>
<style>
body { background: #1a0033; color: white; text-align: center; font-family: sans-serif; padding: 20px; }
h1 { font-size: 50px; color: #FFD700; }
.box { border: 1px solid #FF69B4; padding: 20px; margin: 20px auto; border-radius: 20px; max-width: 500px; background: #2a0055; }
button { background: #FFD700; color: black; border: none; padding: 12px 20px; margin: 8px; border-radius: 10px; font-weight: bold; font-size: 16px; cursor: pointer; width: 90%; }
button:hover { background: #FF69B4; color: white; }
#result { font-size: 22px; color: #FFD700; font-weight: bold; margin-top: 15px; }
a { color: #FF69B4; text-decoration: none; font-weight: bold; }
</style>
</head>
<body>
<h1>RAKESH 👑💖</h1>
<p>Anantapur | Cute KING | Sweet Heart</p>

<div class="box">
<h2>💖 RAKESH Cute Silly Quiz</h2>
<p>Nuvvu RAKESH ni Entha Baga Thelusu?</p>
<p id="question">Loading...</p>
<div id="options"></div>
<p id="result"></p>
<button onclick="nextQ()" id="nextBtn" style="display:none;">Next ➡️</button>
<button onclick="startQuiz()" id="restartBtn" style="display:none;">Malli Aadu 🔁</button>
</div>

<div class="box">
<h2>Follow Me 💖</h2>
<a href="https://www.instagram.com/ra_kesh.8a">Instagram - @ra_kesh.8a</a>
</div>

<script>
let questions = [
  { q: "1. RAKESH - Roju - Enni Sarlu - Phone Chusthadu?", options: ["10 Times", "100 Times", "Lekka Ledhu", "Phone Ne - RAKESH ni Chusthundi"], ans: "Lekka Ledhu" },
  { q: "2. RAKESH - Ki - Istamaina Food Enti?", options: ["Biryani 🍗", "Pizza", "Pani Puri", "Anni - Aakali Veste - Anni Istam"], ans: "Biryani 🍗" },
  { q: "3. RAKESH - Song Vinte - Emi Chesthadu?", options: ["Paaduthadu", "Dance Chesthadu", "Friends ni Kuda Disturb Chesthadu", "Anni - Full Volume lo 😂"], ans: "Anni - Full Volume lo 😂" },
  { q: "4. RAKESH - Ki - Morning - Leka - Enduku Kashtam?", options: ["Chali Kabatti", "Nidra Sweet Kabatti", "Phone Sweet Kabatti", "Anni - Morning Ante - Enemy"], ans: "Nidra Sweet Kabatti" },
  { q: "5. RAKESH - Friends Tho Unte - Ela Untadu?", options: ["Silent", "Full Comedy", "Full Eating", "Full Comedy + Full Eating 😎"], ans: "Full Comedy + Full Eating 😎" },
  { q: "6. RAKESH - Ki - Selfie Ante - Enti?", options: ["Timepass", "Hobby", "Addiction", "Selfie Lekunda - Roju Complete Avadu 📸"], ans: "Selfie Lekunda - Roju Complete Avadu 📸" },
  { q: "7. RAKESH - Ki - Evarante - Ekkuva Istam?", options: ["Amma", "Friends", "Biryani", "Anni - Andaru - Equal ga ❤️"], ans: "Anni - Andaru - Equal ga ❤️" },
  { q: "8. RAKESH - Tension Lo Unte - Emi Chesthadu?", options: ["Song Vintadu", "Walk Ki Velthadu", "Friends Ki Call Chesthadu", "Anni - Malli Cool Aipothadu"], ans: "Anni - Malli Cool Aipothadu" },
  { q: "9. RAKESH - Ki - Best Compliment Enti?", options: ["Nuvvu Cute", "Nuvvu Funny", "Nuvvu KING", "Anni - Vinte - Siggu Padathadu 🥰"], ans: "Anni - Vinte - Siggu Padathadu 🥰" },
  { q: "10. RAKESH - Ni - Chusina Ammayilu - Emi Antaru?", options: ["Cute Boy", "Funny Boy", "Sweet Boy", "Anni - RAKESH Ante - Cute + Funny + Sweet 💖"], ans: "Anni - RAKESH Ante - Cute + Funny + Sweet 💖" }
];
let current = 0, score = 0;
function showQ() {
  document.getElementById("result").innerText = "";
  document.getElementById("nextBtn").style.display = "none";
  let qq = questions[current];
  document.getElementById("question").innerText = qq.q;
  let html = "";
  qq.options.forEach(opt => {
    html += `<button onclick="checkAns('${opt}')">${opt}</button>`;
  });
  document.getElementById("options").innerHTML = html;
}
function checkAns(opt) {
  if (opt === questions[current].ans) {
    score++;
    document.getElementById("result").innerText = "✅ Correct! Nuvvu RAKESH ni Baaga Thelusu! 💖";
  } else {
    document.getElementById("result").innerText = "❌ Ayyo! Correct - " + questions[current].ans;
  }
  document.getElementById("options").innerHTML = "";
  document.getElementById("nextBtn").style.display = "block";
}
function nextQ() {
  current++;
  if (current < questions.length) { showQ(); }
  else {
    let msg = "";
    if (score >= 8) msg = "🔥 " + score + "/10 - NUVVU RAKESH KI BEST FRIEND! 💖";
    else if (score >= 5) msg = "😎 " + score + "/10 - Parledhu - Cute ga Thelusu!";
    else msg = "😂 " + score + "/10 - Inka RAKESH ni Thelusukovali!";
    document.getElementById("question").innerText = "Quiz Aipoyindi!";
    document.getElementById("result").innerText = msg + " Screenshot Theesi RAKESH Ki Pampu!";
    document.getElementById("nextBtn").style.display = "none";
    document.getElementById("restartBtn").style.display = "block";
  }
}
function startQuiz() {
  current = 0; score = 0;
  document.getElementById("restartBtn").style.display = "none";
  showQ();
}
startQuiz();
</script>
</body>
</html>
